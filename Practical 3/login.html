<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <center>
        <h1><u>Charotar University of Science and Technology</u></h1>
        <hr>
        <h2><u>Student Portal Login</u></h2>
        <img src="images (1).jpg" height="180"  width="200" alt="Charusat logo="80">
        <br><br>
        <form action="Homepage.html">

            <label><b>Username</b></label><br>
            <input type="text" placeholder="Enter Username" required>

            <br><br>

            <label><b>Password</b></label><br>
            <input type="password" placeholder="Enter Password" required>

            <br><br>

            <input type="checkbox">Remember Me

            <br><br>

            <button type="submit">Login</button>
            <button type="reset">Clear</button>
            <button onclick="window.location.href='registration.html'" type="submit">Register</button>
        </form>
        <br>
        <small>© 2026 CHARUSAT Student Portal</small>
        <script src="login.js"></script>
    </center>
</body>
</html>
